name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build and sign APK
        env:
          VIBE_KEYSTORE_BASE64: ${{ secrets.VIBE_KEYSTORE_BASE64 }}
          VIBE_KEY_ALIAS: ${{ secrets.VIBE_KEY_ALIAS }}
          VIBE_KEYSTORE_PASSWORD: ${{ secrets.VIBE_KEYSTORE_PASSWORD }}
          VIBE_KEY_PASSWORD: ${{ secrets.VIBE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$VIBE_KEYSTORE_BASE64" ]]; then
            export VIBE_KEYSTORE="$RUNNER_TEMP/vibe-signing.keystore"
            trap 'rm -f "$VIBE_KEYSTORE"' EXIT
            printf '%s' "$VIBE_KEYSTORE_BASE64" | base64 --decode > "$VIBE_KEYSTORE"
            echo 'Signing: configured persistent key' > signing-info.txt
          else
            if [[ -n "$VIBE_KEY_ALIAS$VIBE_KEYSTORE_PASSWORD$VIBE_KEY_PASSWORD" ]]; then
              echo 'Signing secrets are incomplete.' >&2
              exit 1
            fi
            echo 'Signing: temporary key generated for this run. Cannot update another build.' > signing-info.txt
          fi
          python3 launcher/build.py
          cd launcher/build
          sha256sum vibe-home.apk > SHA256SUMS.txt
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: vibe-home-${{ github.sha }}
          path: |
            launcher/build/vibe-home.apk
            launcher/build/SHA256SUMS.txt
            launcher/build/artifact.json
            signing-info.txt
          if-no-files-found: error
